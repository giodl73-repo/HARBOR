[workspace]
members = ["crates/harbor-network", "crates/harbor-corpus", "crates/harbor-score", "crates/harbor-tier", "crates/harbor-gap", "crates/harbor-cli", "crates/harbor-web"]
resolver = "3"

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.1.0"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
