[package]
name = "harbor-web"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "harbor-browser"
path = "src/main.rs"

[dependencies]
harbor-corpus = { path = "../harbor-corpus" }
harbor-gap = { path = "../harbor-gap" }
harbor-score = { path = "../harbor-score" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
