[package]
name = "harbor-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "harbor"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
harbor-corpus = { path = "../harbor-corpus" }
harbor-gap = { path = "../harbor-gap" }
harbor-score = { path = "../harbor-score" }
harbor-tier = { path = "../harbor-tier" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
